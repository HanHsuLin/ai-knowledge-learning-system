<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4 連結知識｜AI跨來源知識整合學習系統</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="knowledge-links">
  <main class="app-shell">
    <header class="topbar">
      <a class="icon-link" href="database.html" aria-label="前往資料庫"><span class="menu-glyph"></span></a>
      <h1>AI跨來源知識整合學習系統</h1>
      <a class="icon-link" href="index.html" aria-label="回到學習首頁"><span class="home-glyph"></span></a>
    </header>
    <div class="workflow-top-gap" aria-hidden="true"></div>
    <div class="date-strip"><span id="today"></span><span>時間：<b id="now-time"></b></span><span>步驟 4：連結知識</span></div>
    <nav class="step-nav" aria-label="學習步驟">
      <a class="step-link" data-step="1" href="index.html">1 上傳材料</a>
      <a class="step-link" data-step="2" href="dialogue.html">2 對話思考</a>
      <a class="step-link" data-step="3" href="viewpoint.html">3 整理觀點</a>
      <a class="step-link" data-step="4" href="knowledge-links.html">4 連結知識</a>
    </nav>

    <section class="card comparison-card" aria-labelledby="comparison-title">
      <div class="row between">
        <div><p class="eyebrow">Cross-source comparison</p><h2 id="comparison-title">比較不同時間與來源的觀點</h2></div>
        <span class="tag yellow">Mock AI</span>
      </div>
      <div class="comparison-viewpoints">
        <article class="soft-card source-box">
          <span id="old-date" class="tag"></span>
          <h3 id="old-title"></h3>
          <p id="old-snippet-label" class="snippet-label">從歷史紀錄擷取的相關文字</p>
          <p id="old-viewpoint" class="viewpoint"></p>
        </article>
        <article class="soft-card source-box">
          <span id="new-date" class="tag yellow"></span>
          <h3 id="new-title"></h3>
          <p class="snippet-label">從本次紀錄擷取的相關文字</p>
          <p id="new-viewpoint" class="viewpoint"></p>
        </article>
      </div>
      <div id="connection-detection" class="status-note connection-detection"></div>
    </section>

    <section class="card integration-dialogue" aria-label="跨來源觀點對話">
      <div class="row between"><div><p class="eyebrow">學習者 × 模擬 AI</p><h2>比較與融合新舊觀點</h2></div><span class="tag yellow">Mock AI</span></div>
      <div id="connection-chat" class="chat"></div>
      <div class="composer">
        <textarea id="connection-chat-input" placeholder="用自己的話回答；Enter 送出，Shift + Enter 換行"></textarea>
        <button id="send-connection-message" class="btn btn-dark" type="button">送出想法</button>
      </div>
    </section>

    <section id="integration-summary" class="card hidden" aria-labelledby="integration-summary-title">
      <p class="eyebrow">模擬 AI 整理結果</p>
      <h2 id="integration-summary-title">確認跨來源整合觀點</h2>
      <p class="muted">以下內容直接整理自你對新舊觀點的比較與受挑戰後的融合想法；你可以修改後再確認。</p>
      <div class="knowledge-relation-picker">
        <div>
          <label for="knowledge-relation">建立兩筆知識來源的連結</label>
          <p id="relation-source-label" class="muted">請選擇最符合兩筆知識的關係。</p>
        </div>
        <select id="knowledge-relation" aria-describedby="relation-source-label">
          <option value="">選擇知識關係</option>
          <option value="互補關係">互補關係</option>
          <option value="因果關係">因果關係</option>
          <option value="矛盾關係">矛盾關係</option>
          <option value="支持關係">支持關係</option>
          <option value="修正關係">修正關係</option>
          <option value="條件限制關係">條件限制關係</option>
        </select>
      </div>
      <textarea id="integration-editor" class="readonly-editor" readonly></textarea>
      <div class="integration-actions">
        <button id="edit-integration" class="btn" type="button">修改</button>
        <button id="open-integration-assistant" class="btn" type="button" aria-expanded="false">修改助手</button>
        <button id="confirm-integration" class="btn btn-primary" type="button">確認整合</button>
      </div>
    </section>

    <aside id="integration-revision-assistant" class="card assistant-panel hidden" aria-labelledby="integration-assistant-title">
      <div class="row between assistant-title"><h2 id="integration-assistant-title">跨來源觀點修改助手</h2><span class="tag yellow">Mock AI</span></div>
      <div id="integration-revision-chat" class="chat assistant-chat"></div>
      <div class="composer compact assistant-composer">
        <textarea id="integration-revision-input" placeholder="詢問如何調整或補強跨來源整合觀點"></textarea>
        <button id="send-integration-revision" class="btn btn-dark" type="button">送出</button>
      </div>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
